<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Env Injector</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px 12px;
            min-width: 400px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f7f8fa;
            color: #333;
        }

        .container {
            width: 400px;
        }

        .section {
            background: #fff;
            border: 1px solid #e6e8eb;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .config-header .config-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #555;
        }

        .config-header .arrow {
            transition: transform 0.2s ease;
            font-size: 10px;
        }

        .config-header.collapsed .arrow {
            transform: rotate(-90deg);
        }

        .config-body {
            display: block;
            overflow: hidden;
            transition: max-height 0.2s ease;
        }

        .config-body.hidden {
            display: none;
        }

        .config-row {
            margin-top: 8px;
        }

        .config-label {
            display: block;
            font-size: 11px;
            color: #666;
            margin-bottom: 3px;
        }

        .config-input {
            width: 100%;
            font-size: 12px;
            padding: 5px 8px;
            border: 1px solid #d0d3d9;
            border-radius: 4px;
            font-family: Consolas, Monaco, monospace;
        }

        .config-input:focus {
            border-color: #438de8;
            outline: none;
            box-shadow: 0 0 0 2px rgba(67, 141, 232, 0.15);
        }

        textarea.config-input {
            resize: vertical;
            min-height: 60px;
        }

        .config-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }

        .btn-small {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 4px;
            border: 1px solid #d0d3d9;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-small:hover {
            background: #f0f2f5;
            border-color: #438de8;
            color: #438de8;
        }

        .btn-small.primary {
            background: #438de8;
            color: #fff;
            border-color: #438de8;
        }

        .btn-small.primary:hover {
            background: #2b78d4;
        }

        .env-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .env-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .env-actions {
            display: flex;
            gap: 6px;
        }

        .env-list {
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid #e6e8eb;
            border-radius: 6px;
            background: #fafbfc;
        }

        .env-row {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 6px;
            padding: 6px 8px;
            border-bottom: 1px solid #eee;
            align-items: center;
        }

        .env-row:last-child {
            border-bottom: none;
        }

        .env-key {
            font-size: 12px;
            font-family: Consolas, Monaco, monospace;
            color: #444;
            background: #eef1f5;
            padding: 3px 6px;
            border-radius: 4px;
            word-break: break-all;
        }

        .env-value-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
        }

        .env-value {
            width: 100%;
            font-size: 12px;
            padding: 3px 6px;
            border: 1px solid #d0d3d9;
            border-radius: 4px;
            font-family: Consolas, Monaco, monospace;
        }

        .env-value:focus {
            border-color: #438de8;
            outline: none;
            box-shadow: 0 0 0 2px rgba(67, 141, 232, 0.2);
        }

        .env-empty {
            padding: 16px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }

        .env-status {
            margin-top: 6px;
            font-size: 11px;
            color: #666;
        }

        .env-status.success {
            color: #28a745;
        }

        .env-status.error {
            color: #dc3545;
        }

        .env-status.loading {
            color: #438de8;
        }

        .config-hint {
            font-size: 10px;
            color: #999;
            margin-top: 4px;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 配置区（可折叠） -->
        <div class="section">
            <div id="config-header" class="config-header collapsed">
                <div class="config-title">
                    <span>⚙️</span>
                    <span>插件配置</span>
                    <span id="config-summary" style="color:#999;font-weight:normal;"></span>
                </div>
                <span class="arrow">▼</span>
            </div>
            <div id="config-body" class="config-body hidden">
                <div class="config-row">
                    <label class="config-label">属性名（window 上的属性名）</label>
                    <input type="text" id="cfg-property-name" class="config-input" value="__ENV__" placeholder="例如：__ENV__" />
                </div>
                <div class="config-row">
                    <label class="config-label">Key 模板（每行一个 key，用于 env.js 为空时显示）</label>
                    <textarea id="cfg-key-template" class="config-input" placeholder="GATEWAY_BIZ_HOST&#10;GATEWAY_BIZ_PORT&#10;GATEWAY_WS_PORT"></textarea>
                    <div class="config-hint">当 env.js 为空或未定义该属性时，弹窗会根据此模板显示 key（值为 undefined）。已定义的 key 不受影响。</div>
                </div>
                <div class="config-actions">
                    <button id="cfg-apply" class="btn-small primary">应用配置</button>
                </div>
            </div>
        </div>

        <!-- 环境变量区 -->
        <div class="section">
            <div class="env-toolbar">
                <div class="env-title">
                    <span>🛠️</span>
                    <span id="env-title-text">window.__ENV__</span>
                </div>
                <div class="env-actions">
                    <button id="env-refresh" class="btn-small">刷新</button>
                    <button id="env-save" class="btn-small primary">保存修改</button>
                    <button id="env-reset" class="btn-small">重置</button>
                </div>
            </div>
            <div id="env-list" class="env-list">
                <div class="env-empty">正在加载数据…</div>
            </div>
            <div id="env-status" class="env-status"></div>
        </div>
    </div>
    <script src="../js/popup.js"></script>
</body>

</html>
